#HTTP(S) proxy port, no startup if empty
# 可热更新参数已迁移到 conf/global.json（Web → 全局参数，保存即生效）：
# appname / web_welcome / web_subtitle / allow_* / ip_limit / open_captcha /
# allow_x_real_ip / allow_remote_update / allow_web_terminal / waf_* 开关 /
# register_* / smtp_* / notify_* / max_* / release_* / 错误页品牌 等。
# 端口、证书路径、geoip 路径、web_secure_entry、totp 等仍须改本文件并重启。
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443
##bridge
bridge_type=tcp
bridge_port=8024
bridge_ip=0.0.0.0

# Public password, which clients can use to connect to the server
# After the connection, the server will be able to open relevant ports and parse related domain names according to its own configuration file.
public_vkey=123

#Traffic data persistence interval(minute)
#Ignorance means no persistence
flow_store_interval=1

# log level LevelEmergency->0  LevelAlert->1 LevelCritical->2 LevelError->3 LevelWarning->4 LevelNotice->5 LevelInformational->6 LevelDebug->7
log_level=6
log_path=nps.log

#p2p
p2p_ip=127.0.0.1
p2p_port=6000
# 可选 holepunch 协调器 TLS 端口；0 或不配置=不启用（仅 modern npc 拨入）
#p2p_holepunch_port=0

#web
web_host=a.o.com
web_username=admin
web_password=123
web_port = 8081
web_ip=0.0.0.0
web_base_url=
web_open_ssl=false
web_cert_file=conf/server.pem
web_key_file=conf/server.key
# if web under proxy use sub path. like http://host/nps need this.
#web_base_url=/nps
# --- 面板展示（种子；正式以「全局参数」为准，可热重载）---
# appname=NPS
# web_welcome=DNS二线
# web_subtitle=内网穿透控制台
# --- 管理员登录 TOTP（空=关闭；nps -gen2fa 生成后填入并重启）---
# totp_secret=
# --- 安全入口（空=关闭；非空须先访问该路径解锁 Session 后才显示登录页；改后需重启）---
# web_secure_entry=/s/请换成长随机串

#Web API unauthenticated IP address(the len of auth_crypt_key must be 16)
#Remove comments if needed
#auth_key=test
auth_key=123
#获取服务端authKey时的aes加密密钥，16位
auth_crypt_key =213

#cache
http_cache=false
http_cache_length=100

#pprof debug options
#pprof_ip=0.0.0.0
#pprof_port=9999

#client disconnect timeout
disconnect_timeout=60


# 是否开启tls
tls_enable=true
tls_bridge_port=8025

# --- 融合可选旁路（未配置端口则不监听，不影响旧 npc）---
# bridge_kcp_port=
# bridge_ws_port=
# bridge_wss_port=
# bridge_quic_port=   # UDP QUIC 旁路；npc -type=quic -server=host:port
# bridge_path=/ws
# bridge_select_mode=primary
# bridge_require_tls=false
# bridge_secure_handshake=false
# auth_time_window=300
# 管理面审计：空/未配置=关闭；相对路径相对运行目录；写失败不影响转发
# audit_log_path=
# 连接审计（上下线）；需同时配置 audit_log_path；默认关
# audit_connection=false
# 同一 client+动作最短写间隔（秒）；0=不去抖；默认 30
# audit_connection_min_interval=30
# --- HTTP/3（UDP；需同时启用 https_proxy_port；空=不监听）---
# http3_proxy_port=
# --- 真实 IP（域名 HTTP；默认开；内置多 CDN 头顺序）---
# allow_x_real_ip=true
# trusted_proxy_ips=
# --- 远程升级 npc（默认关）---
# allow_remote_update=false
# --- P2P（npc -p2p_mode=legacy|stun|modern）---
# p2p_mode=legacy
# p2p_stun_servers=stun.stunprotocol.org:3478
# --- 注册增强 ---
# register_rate_limit=5
# register_email_verify=false
# smtp_host=
# smtp_port=587
# smtp_security=starttls
# smtp_user=
# smtp_pass=
# smtp_from=
# --- 面板终端（默认关；需要面板终端时改为 true 并重启）---
# allow_web_terminal=false
# --- 自建下载源（空=GitHub cloudwebsite/nps）---
# release_api_url=
# release_download_base=
# --- 错误页与运维通知（默认全关）---
# http_error_page_path=
# http_error_page_brand=nps
# http_error_page_brand_url=
# notify_enable=false
# notify_title_prefix=[nps]
# notify_min_interval=30
# notify_error_page_min_interval=300
# notify_queue_size=64
# notify_http_timeout=5
# notify_public_client=false
# notify_wecom_webhook=
# notify_telegram_bot_token=
# notify_telegram_chat_id=
# notify_webhook_url=
# notify_webhook_header=

# --- WAF / GeoIP（默认全关；waf_protect_panel 默认开，总开关开启后面板同防护）---
# waf_enable=false
# waf_protect_panel=true
# waf_ua_blacklist_enable=false
# waf_block_foreign_enable=false
# waf_custom_rules_enable=false
# waf_block_foreign_unknown=true
# waf_country_headers=CF-IPCountry
# geoip_path=conf/geoip.dat
# geosite_path=conf/geosite.dat
# waf_rules_path=conf/waf.json
# 首次可复制 conf/waf.json.example 为 conf/waf.json，或面板保存；
# Geo 数据：nps -updategeo 或「全局参数」页更新按钮（勿提交 geoip.dat 进 git）
# 开禁国外并防护面板前，境外运维请先在 waf.json 加 ip_allowlist
