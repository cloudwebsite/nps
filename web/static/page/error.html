<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>无法访问</title>
    <style>
        :root {
            --canvas: #f2f5f4;
            --ink: #15231f;
            --muted: #5a6b66;
            --accent: #0d9488;
            --line: #d7e0dc;
            --surface: #fff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 480px at 10% -10%, #dceae6 0%, transparent 55%),
                radial-gradient(900px 420px at 100% 0%, #e7efec 0%, transparent 50%),
                var(--canvas);
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px 32px 28px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(21, 35, 31, .06);
            text-align: center;
        }
        .code {
            display: inline-block;
            margin-bottom: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            background: #e6f7f5;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .04em;
        }
        h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; }
        p { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }
        .meta { margin: 0 0 22px; color: #8a9a95; font-size: 12px; line-height: 1.5; word-break: break-all; }
        .brand { font-size: 12px; color: var(--muted); }
        .brand a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .brand a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">{{status}}</div>
        <h1>无法访问</h1>
        <p>{{message}}</p>
        <p class="meta">目标不可达或域名未配置。<br>Host: {{host}}<br>{{time}}</p>
        <div class="brand">powered by {{brand_link}}</div>
    </div>
</body>
</html>
