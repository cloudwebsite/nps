<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="page-edit"></h3>
            <div class="ibox-content compact-box">
                <form class="compact-form">
                    <input type="hidden" name="id" value="{{.t.Id}}">
                    <div class="form-section"><i class="fa fa-id-card"></i><span langtag="word-formbasic"></span></div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="type" id="type">
                                <option value="tcp" langtag="scheme-tcp"></option>
                                <option value="udp" langtag="scheme-udp"></option>
                                <option value="httpProxy" langtag="scheme-httpProxy"></option>
                                <option value="socks5" langtag="scheme-socks5"></option>
                                <option value="mixProxy" langtag="scheme-mixproxy"></option>
                                <option value="secret" langtag="scheme-secret"></option>
                                <option value="p2p" langtag="scheme-p2p"></option>
                                <option value="shadowsocks" langtag="scheme-shadowsocks">Shadowsocks</option>
                                {{/*
                                <option value="file" langtag="scheme-file"></option>
                                */}}
                            </select>
                            <span class="help-block m-b-none font-bold" langtag="word-usecase"></span>:
                            <span id="usecase">
                                <span id="casetcp" langtag="info-casetcp"></span>
                                <span id="caseudp" langtag="info-caseudp"></span>
                                <span id="casehttpProxy" langtag="info-casehttpproxy"></span>
                                <span id="casesocks5" langtag="info-casesocks5"></span>
                                <span id="casemixProxy" langtag="info-casemixproxy"></span>
                                <span id="casesecret" langtag="info-casesecret"></span>
                                <span id="casep2p" langtag="info-casep2p"></span>
                                <span id="caseshadowsocks" langtag="info-caseshadowsocks">SS2022 入站代理</span>
                                <span id="casefile" langtag="info-casefile"></span>
                            </span>
                        </div>
                    </div>

                    <div class="form-group" id="client_id">
                        <label class="col-sm-2 control-label font-bold"><span langtag="word-clientid"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="client_id" placeholder="" id="nps_client_id"
                                    langtag="word-belongclient" data-required="true"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Remark}}" class="form-control" type="text" name="remark" placeholder=""
                                   langtag="info-unrestricted">
                        </div>
                    </div>
                    <div class="form-section"><i class="fa fa-plug"></i><span langtag="word-formconnection"></span></div>
                    {{if eq true .allow_multi_ip}}
                    <div class="form-group" id="server_ip">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverip"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" value="{{.t.ServerIp}}" name="server_ip"
                                   placeholder="" langtag="info-suchasip">
                        </div>
                    </div>
                    {{end}}
                    <div class="form-group" id="port">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverport"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Port}}" class="form-control" type="text" name="port" placeholder=""
                                   langtag="info-suchasport">
                        </div>
                    </div>
                    {{if eq true .allow_local_proxy}}
                    <div class="form-group" id="local_proxy">
                        <label class="control-label col-sm-2 font-bold" langtag="word-proxytolocal"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="local_proxy">
                                <option {{if eq false .t.Target.LocalProxy}}selected{{end}} value="0"
                                        langtag="word-no"></option>
                                <option {{if eq true .t.Target.LocalProxy}}selected{{end}} value="1"
                                        langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                    {{end}}
                    <div class="form-group span-full" id="target">
                        <label class="col-sm-2 control-label font-bold"><span langtag="word-target"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="target" rows="3" placeholder=""
                                      langtag="info-suchasiplist" data-required="true">{{.t.Target.TargetStr}}</textarea>
                            <span class="help-block m-b-none" langtag="info-targettunnel"></span>
                        </div>
                    </div>

                    <div class="form-group" id="local_path">
                        <label class="col-sm-2 control-label font-bold"><span langtag="word-localpath"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                            <input value="{{.t.LocalPath}}" class="form-control" type="text" name="local_path"
                                   placeholder="" langtag="info-suchaslocalpath" data-required="true">
                        </div>
                    </div>

                    <div class="form-group" id="strip_pre">
                        <label class="col-sm-2 control-label font-bold" langtag="word-stripprefix"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.StripPre}}" class="form-control" type="text" name="strip_pre"
                                   placeholder="" langtag="info-suchasstripprefix">
                        </div>
                    </div>

                    <div class="form-group" id="password">
                        <label class="col-sm-2 control-label font-bold"><span langtag="word-identificationkey"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                            <div class="input-group">
                                <input value="{{.t.Password}}" class="form-control" type="text" name="password" id="password_input"
                                       placeholder="" langtag="word-identificationkey" data-required="true">
                                <span class="input-group-btn">
                                    <button type="button" class="btn btn-white" id="btn_gen_sspsk" style="display:none;"
                                            onclick="genSspsk()">生成 PSK</button>
                                </span>
                            </div>
                            <span class="help-block m-b-none" id="password_help" langtag="info-identificationkey"></span>
                            <span class="help-block m-b-none" id="ss_help" style="display:none;" langtag="info-sspsk">Shadowsocks 2022（blake3-aes-128-gcm）：可一键生成 16 字节 base64 PSK</span>
                        </div>
                    </div>

                    <div class="form-group" id="proto_version">
                        <label class="control-label font-bold" langtag="word-proxyprotocol">Proxy Protocol</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="proto_version"  id="ProtoVersion">
                                <option value=""></option>
                                <option value="V1">V1</option>
                                <option value="V2">V2</option>
                            </select>
                            <span class="help-block m-b-none">开启此功能，请确保本地的服务能够支持 Proxy Protocol 协议。</span>
                        </div>
                    </div>

                    <div class="form-group" id="idle_auto_stop_minutes">
                        <label class="control-label font-bold" langtag="word-idle-autostop">闲置自动停用（分钟）</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="idle_auto_stop_minutes" id="IdleAutoStopMinutes">
                                <option value="0" langtag="word-close">关闭</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="30">30</option>
                                <option value="60">60</option>
                                <option value="120">120</option>
                                <option value="360">360</option>
                            </select>
                            <span class="help-block m-b-none" langtag="info-idle-autostop">仅 tcp/udp：无活动连接满设定分钟后自动停用；需要时再到列表中开启。0=不启用。</span>
                        </div>
                    </div>

                    <div class="form-group" id="http_proxy">
                        <label class="col-sm-2 control-label font-bold" langtag="scheme-httpproxy">HTTP 代理</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="http_proxy">
                                <option value="1" {{if .mix_http}}selected{{end}} langtag="word-yes"></option>
                                <option value="0" {{if not .mix_http}}selected{{end}} langtag="word-no"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="socks5_proxy">
                        <label class="col-sm-2 control-label font-bold" langtag="scheme-socks5">SOCKS5 代理</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="socks5_proxy">
                                <option value="1" {{if .mix_socks}}selected{{end}} langtag="word-yes"></option>
                                <option value="0" {{if not .mix_socks}}selected{{end}} langtag="word-no"></option>
                            </select>
                        </div>
                    </div>

                    <div class="hr-line-dashed"></div>
                    <div class="form-group form-actions">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button"
                                    onclick="submitform('edit', '{{.web_base_url}}/index/edit', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-save"></span>

                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<script>
    var arr = []
    arr["all"] = ["port", "target", "password", "local_path", "strip_pre", "local_proxy"]
    arr["tcp"] = ["client_id", "port", "target", "local_proxy", "proto_version", "idle_auto_stop_minutes"]
    arr["udp"] = ["client_id", "port", "target", "local_proxy", "idle_auto_stop_minutes"]
    arr["socks5"] = ["client_id", "port"]
    arr["httpProxy"] = ["client_id", "port"]
    arr["mixProxy"] = ["client_id", "port", "http_proxy", "socks5_proxy"]
    arr["secret"] = ["client_id", "target", "password"]
    arr["p2p"] = ["client_id", "target", "password"]
    arr["file"] = ["client_id", "port", "local_path", "strip_pre"]
    arr["shadowsocks"] = ["client_id", "port", "password"]

    function genSspsk() {
        $.getJSON("{{.web_base_url}}/index/generatesspsk", function (res) {
            if (res && res.status && res.psk) {
                $("#password_input").val(res.psk)
            } else {
                alert("生成失败")
            }
        })
    }

    function resetForm() {
        $(".form-group[id]").css("display", "none");
        $("#usecase span").css("display", "none");
        o = $("#type").val();
        $('#case' + o).css("display", "inline")
        for (var i = 0; i < arr[o].length; i++) {
            $("#" + arr[o][i]).css("display", "block")
        }
        var isSs = (o === "shadowsocks")
        $("#btn_gen_sspsk").toggle(isSs)
        $("#ss_help").toggle(isSs)
        $("#password_help").toggle(!isSs)
        $("#password_input").attr("data-required", isSs ? "false" : "true")
    }

    $(function () {
        $("#type").val('{{.t.Mode}}');
        $("#ProtoVersion").val('{{.t.ProtoVersion}}');
        (function () {
            var m = '{{.t.IdleAutoStopMinutes}}';
            var $sel = $("#IdleAutoStopMinutes");
            if ($sel.find("option[value='" + m + "']").length === 0 && m !== '' && m !== '0') {
                $sel.append($('<option></option>').val(m).text(m));
            }
            $sel.val(m === '' ? '0' : m);
        })();
        resetForm()
        $("#type").on("change", function () {
            resetForm()
        })
        $("#use_client").on("change", function () {
            resetForm()
        })

        if (window.npsLoadClientSelect) {
            window.npsLoadClientSelect("select[name='client_id']", "{{.t.Client.Id}}");
        }
    })
</script>
