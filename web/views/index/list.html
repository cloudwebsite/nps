<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5><span id="langtag"></span><span></span></h5>

                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
                <div class="content">
                    <div class="table-responsive">
                        <div id="toolbar" class="nps-toolbar-row">
                            <a href="{{.web_base_url}}/index/add?type={{.type}}&client_id={{.client_id}}" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span></a>
                            <a href="#" onclick="batchDelete('{{.web_base_url}}/index/del');return false;" class="btn btn-danger dim">
                            <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span></a>
                        </div>
                        <table id="taskList_table" class="table-striped table-hover" data-mobile-responsive="true"></table>
                    </div>
                </div>
                <div class="ibox-content">

                    <table id="table"></table>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    name = '{{.name}}:'.replace(/\s*/g,"")
    $('#langtag').attr('langtag','page-list' + name.replace(/:.*/,"")).next().text(name.split(":")[1])

    /*bootstrap table*/
    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/index/gettunnel", // 服务器数据的加载地址
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "type":{{.type}},
                "client_id":{{.client_id}},
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        search: true,
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageSize: npsPageSize.get(),//每页条数，优先使用上次选择
        pageList: npsPageSize.list,//分页步进值
        onPageChange: function (number, size) { npsPageSize.save(size); },
        detailView: true,
        smartDisplay: false, // 始终显示完整的每页条数和分页栏
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onLoadSuccess:function (data) {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang ('#table'); },
        detailFormatter: function (index, row, element) {
            tmp = '<b langtag="word-exportflow"></b>: ' + changeunit(row.Flow.ExportFlow) + '&emsp;'
                    + '<b langtag="word-inletflow"></b>: ' + changeunit(row.Flow.InletFlow) + '&emsp;'
                    + '<b langtag="word-crypt"></b>: ' + row.Client.Cnf.Crypt + '&emsp;'
                    + '<b langtag="word-compress"></b>: ' + row.Client.Cnf.Compress + '&emsp;'
                    + '<b langtag="word-basicusername"></b>: ' + row.Client.Cnf.U + '&emsp;'
                    + '<b langtag="word-basicpassword"></b>: ' + row.Client.Cnf.P + '&emsp;'
                    + '<b langtag="word-protoversion"></b>: ' + row.ProtoVersion + '&emsp;'
            var copyBtn = '<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="" langtag="word-copy">复制</button>'
            if (row.Mode == "p2p") {
                var p2pCmd = tmp + "<br/><br>"
                        + '<b langtag="word-commandaccessp2p"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + row.Client.VerifyKey 
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -target=" + row.Target.TargetStr + "</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2ps"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + row.Client.VerifyKey 
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -local_type=p2ps" + "</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2pt"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + row.Client.VerifyKey 
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -local_type=p2pt" + "</code>" + copyBtn
                {{if .tls_enable}}
                p2pCmd += "<br/><br>"
                        + '<b langtag="word-commandaccessp2p-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + row.Client.VerifyKey
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -target=" + row.Target.TargetStr + " -tls_enable=true</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2ps-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + row.Client.VerifyKey
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -local_type=p2ps -tls_enable=true</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2pt-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + row.Client.VerifyKey
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -local_type=p2pt -tls_enable=true</code>" + copyBtn
                {{end}}
                return p2pCmd
            }
            if (row.Mode == "secret") {
                var secretCmd = tmp + "<br/><br>" + '<b langtag="word-commandaccess"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + row.Client.VerifyKey 
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -local_type=secret" + "</code>" + copyBtn
                {{if .tls_enable}}
                secretCmd += "<br/><br>" + '<b langtag="word-commandaccess-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + row.Client.VerifyKey
                        + " -type=" +{{.bridgeType}} +" -password=" + row.Password + " -local_type=secret -tls_enable=true</code>" + copyBtn
                {{end}}
                return secretCmd
            }
            return tmp
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
            },
            {
                field: 'ClientId',//域值
                title: '<span langtag="word-clientid"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return row.Client.Id + '-' + row.Client.Remark
                }
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'Client.VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                visible: true//false表示不显示
            },
            {
                field: 'Mode',//域值
                title: '<span langtag="word-scheme"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return '<span langtag="scheme-' + value + '"></span>'
                }
            },
            {
                field: 'Port',//域值
                title: '<span langtag="word-port"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                visible: true//false表示不显示
            },
            {
                field: 'address',//域值
                title: '<span langtag="word-accessaddress"></span>',//标题
                halign: 'center',
                sortable: false, //计算列，按 Port 排序即可
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var address = {{.ip}} + ":" + row.Port
                    return "<a href='http://" + address + "' target='_blank'>" + address + "</a>"
                }
            },
            {
                field: 'Target',//域值
                title: '<span langtag="word-target"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return row.Target.TargetStr
                }
            },
            {
                field: 'Password',//域值
                title: '<span langtag="word-identificationkey"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'IdleAutoStopMinutes',
                title: '<span langtag="word-idle-autostop-short">闲置停用</span>',
                align: 'center',
                halign: 'center',
                visible: true,
                sortable: true,
                formatter: function (value) {
                    var m = parseInt(value, 10) || 0;
                    return m > 0 ? (m + 'm') : '-';
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value) {
                    return npsOpenBadge(!!value, 'open', 'close');
                }
            },
            {
                field: 'RunStatus',//域值
                title: '<span langtag="word-runstatus"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value) {
                    return npsOpenBadge(!!value, 'open', 'close');
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-clientstatus"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row) {
                    return npsOnlineBadge(!!(row.Client && row.Client.IsConnect), 'online', 'offline');
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                width: '200px',
                visible: true,//false表示不显示
                class: 'tunnel-list__actions',
                formatter: function (value, row, index) {
                    var btn_group = '<div class="tunnel-actions">'
                    if (row.Status) {
                        btn_group += '<button type="button" onclick="submitform(\'stop\', \'{{.web_base_url}}/index/stop\', {\'id\':' + row.Id
                        btn_group += '})" class="btn btn-outline btn-warning" title="停用隧道" data-title-zh="停用隧道" data-title-en="Disable tunnel" data-aria-label-zh="停用隧道" data-aria-label-en="Disable tunnel"><i class="fa fa-pause" aria-hidden="true"></i></button>'
                    } else {
                        btn_group += '<button type="button" onclick="submitform(\'start\', \'{{.web_base_url}}/index/start\', {\'id\':' + row.Id
                        btn_group += '})" class="btn btn-outline btn-primary" title="启用隧道" data-title-zh="启用隧道" data-title-en="Enable tunnel" data-aria-label-zh="启用隧道" data-aria-label-en="Enable tunnel"><i class="fa fa-play" aria-hidden="true"></i></button>'
                    }
                    btn_group += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/index/del\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger" title="删除隧道" data-title-zh="删除隧道" data-title-en="Delete tunnel" data-aria-label-zh="删除隧道" data-aria-label-en="Delete tunnel"><i class="fa fa-trash" aria-hidden="true"></i></button>'
                    btn_group += '<a href="{{.web_base_url}}/index/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-success" title="编辑隧道" data-title-zh="编辑隧道" data-title-en="Edit tunnel" data-aria-label-zh="编辑隧道" data-aria-label-en="Edit tunnel"><i class="fa fa-edit" aria-hidden="true"></i></a>'
                    btn_group += '<button type="button" onclick="submitform(\'copy\', \'{{.web_base_url}}/index/copy\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-primary" title="复制隧道" data-title-zh="复制隧道" data-title-en="Copy tunnel" data-aria-label-zh="复制隧道" data-aria-label-en="Copy tunnel"><i class="fa fa-copy" aria-hidden="true"></i></button></div>'
                    return btn_group
                }
            }
        ]
    });

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling.innerHTML)
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        toastr.success('复制成功');
        e.clearSelection();
    });
    clipboard.on('error', function (e) {
        toastr.error('复制失败', '提示');
    });
</script>
