<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="page-hostedit"></h3>
            <div class="ibox-content compact-box">
                <form class="compact-form">
                    <input type="hidden" name="id" value="{{.h.Id}}">
                    <div class="form-section"><i class="fa fa-id-card"></i><span langtag="word-formbasic"></span></div>
                    <div class="form-group">
                        <label class="control-label font-bold"><span langtag="word-clientid"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="client_id" placeholder=""
                                    langtag="word-belongclient" data-required="true"></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input value="{{.h.Remark}}" class="form-control" type="text" name="remark"
                                   placeholder="remark">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label font-bold"><span langtag="word-host"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                            <input value="{{.h.Host}}" class="form-control" type="text" name="host" placeholder="" langtag="info-suchashost" data-required="true">
                        </div>
                    </div>
                    <div class="form-group" id="scheme">
                        <label class="control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <select id="scheme_select" class="form-control" name="scheme">
                                <option {{if eq "all" .h.Scheme}}selected{{end}} value="all" langtag="word-all"></option>
                                <option {{if eq "http" .h.Scheme}}selected{{end}} value="http" langtag="word-http"></option>
                                <option {{if eq "https" .h.Scheme}}selected{{end}} value="https" langtag="word-https"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section" id="https_section"><i class="fa fa-lock"></i><span langtag="word-formhttps"></span></div>
                    <div class="form-group" id="AutoHttps">
                        <label class="control-label font-bold" langtag="word-autohttps">自动 HTTPS（301）</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="AutoHttps">
                                <option {{if eq false .h.AutoHttps}}selected{{end}} value="0" langtag="word-no"></option>
                                <option {{if eq true .h.AutoHttps}}selected{{end}}  value="1" langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="AutoSSL">
                        <label class="control-label font-bold" langtag="word-autossl">ACME 自动证书</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="AutoSSL">
                                <option {{if eq false .h.AutoSSL}}selected{{end}} value="0" langtag="word-no"></option>
                                <option {{if eq true .h.AutoSSL}}selected{{end}} value="1" langtag="word-yes"></option>
                            </select>
                            <span class="help-block" langtag="info-autossl">需服务端配置 ssl_email（建议）且 HTTP/HTTPS 为 80/443，或开启 force_auto_ssl。开启后优先于手工证书路径。</span>
                        </div>
                    </div>
                    <div class="form-group" id="HttpsJustProxy">
                        <label class="control-label font-bold" langtag="word-httpsjustproxy">TLS 直通</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="https_just_proxy">
                                <option {{if eq false .h.HttpsJustProxy}}selected{{end}} value="0" langtag="word-no"></option>
                                <option {{if eq true .h.HttpsJustProxy}}selected{{end}} value="1" langtag="word-yes"></option>
                            </select>
                            <span class="help-block" langtag="info-httpsjustproxy">开启后即使配置了证书也按 SNI 原样转发（不在入口终止 TLS）。默认关。</span>
                        </div>
                    </div>

                    <div class="form-group" id="cert_file">
                        <label class="control-label font-bold" langtag="word-httpscert"></label>
                        <div class="col-sm-10">
                            <textarea rows="4" class="form-control" type="text" name="cert_file_path" id="pemText"
                                      placeholder="请将证书文件拖拽或将内容复制粘贴到此处，证书文件格式为：xxxx_example.com.pem。
或者配置证书文件路径。">{{.h.CertFilePath}}</textarea>
                        </div>
                    </div>
                    <div class="form-group" id="key_file">
                        <label class="control-label font-bold" langtag="word-httpskey"></label>
                        <div class="col-sm-10">
                            <textarea rows="4" class="form-control" type="text" name="key_file_path" id="pemKey"
                                      placeholder="请将私钥文件拖拽或复制粘贴到此处，证书秘钥格式为：xxxx_example.com.key。
或者配置秘钥文件路径。">{{.h.KeyFilePath}}</textarea>
                        </div>
                    </div>
                    <div class="form-section"><i class="fa fa-exchange-alt"></i><span langtag="word-formforward"></span></div>
                    <div class="form-group">
                        <label class="control-label font-bold" langtag="word-urlroute"></label>
                        <div class="col-sm-10">
                            <input value="{{.h.Location}}" class="form-control" type="text" name="location"  placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                {{if eq true .allow_local_proxy}}
                    <div class="form-group" id="local_proxy">
                        <label class="control-label font-bold" langtag="word-proxytolocal"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="local_proxy">
                                <option {{if eq false .h.Target.LocalProxy}}selected{{end}} value="0" langtag="word-no"></option>
                                <option {{if eq true .h.Target.LocalProxy}}selected{{end}} value="1" langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                {{end}}
                    <div class="form-group span-2">
                        <label class="control-label font-bold"><span langtag="word-target"></span><span class="text-danger"> *</span></label>
                        <div class="col-sm-10">
                        <textarea class="form-control" rows="3" type="text" name="target" placeholder="" langtag="info-suchasiplist" data-required="true">{{.h.Target.TargetStr}}</textarea>
                            <span class="help-block m-b-none" langtag="info-targethost"></span>

                        </div>
                    </div>
                    <div class="form-group" id="proxy_protocol">
                        <label class="control-label font-bold" langtag="word-proxyprotocol">Proxy Protocol</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="proxy_protocol">
                                <option {{if eq 0 .h.Target.ProxyProtocol}}selected{{end}} value="0" langtag="word-off">关闭</option>
                                <option {{if eq 1 .h.Target.ProxyProtocol}}selected{{end}} value="1">v1</option>
                                <option {{if eq 2 .h.Target.ProxyProtocol}}selected{{end}} value="2">v2</option>
                            </select>
                            <span class="help-block" langtag="info-proxyprotocol">向后端写 PROXY 头传递访客真实 IP；默认关。</span>
                        </div>
                    </div>
                    <div class="form-group span-2" id="header">
                        <label class="control-label font-bold" langtag="word-requestheader"></label>
                        <div class="col-sm-10">
                        <textarea class="form-control" rows="3" type="text" name="header" placeholder="Cache-Control: no-cache">{{.h.HeaderChange}}</textarea>
                            <span class="help-block m-b-none" langtag="info-header"></span>
                        </div>

                    </div>
                    <div class="form-group" id="hostchange">
                        <label class="control-label font-bold" langtag="word-requesthost"></label>
                        <div class="col-sm-10">
                            <input value="{{.h.HostChange}}" class="form-control" value="" type="text" name="hostchange" placeholder="" langtag="word-requesthost">
                        </div>
                    </div>
                    <div class="form-group span-2" id="respheader">
                        <label class="control-label font-bold" langtag="word-responseheader"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="3" type="text" name="resp_header"
                                      placeholder="-Server&#10;X-NPS: active">{{.h.ResponseHeaderChange}}</textarea>
                            <span class="help-block m-b-none" langtag="info-responseheader"></span>
                        </div>
                    </div>
                    <div class="form-group span-2" id="pathrewrite">
                        <label class="control-label font-bold" langtag="word-pathrewrite"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="2" type="text" name="path_rewrite"
                                      placeholder="/api =&gt; /v1/api">{{.h.PathRewrite}}</textarea>
                            <span class="help-block m-b-none" langtag="info-pathrewrite"></span>
                        </div>
                    </div>
                    <div class="form-group" id="cors">
                        <label class="control-label font-bold">CORS</label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="cors" placeholder="* 或 https://example.com"
                                   value="{{.h.Cors}}">
                            <span class="help-block m-b-none" langtag="info-cors"></span>
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="form-group form-actions">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button" onclick="submitform('edit', '{{.web_base_url}}/index/edithost', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-save"></i> <span langtag="word-save"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        function toggleHttpsFields() {
            var show = $("#scheme_select").val() == "all" || $("#scheme_select").val() == "https";
            $("#https_section").toggle(show);
            $("#cert_file").toggle(show);
            $("#key_file").toggle(show);
            $("#AutoHttps").toggle(show);
            $("#AutoSSL").toggle(show);
        }
        $("#scheme_select").on("change", toggleHttpsFields);
        toggleHttpsFields();


        const pemText = document.getElementById("pemText");
        const pemKey = document.getElementById("pemKey");

        // 阻止浏览器默认打开文件的行为
        document.addEventListener("dragover", function(event) {
            event.preventDefault();
        });

        pemText.addEventListener("drop", function(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                pemText.value = e.target.result;
                console.log("上传pem")
                $('#edit_form').data('bootstrapValidator').updateStatus('pemText', 'NOT_VALIDATED');
                $('#edit_form').data('bootstrapValidator').validateField('pemText');
            }

            reader.readAsText(file);
        });

        pemKey.addEventListener("drop", function(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                pemKey.value = e.target.result;
                $('#edit_form').data('bootstrapValidator').updateStatus('pemKey', 'NOT_VALIDATED');
                $('#edit_form').data('bootstrapValidator').validateField('pemKey');
            }

            reader.readAsText(file);
        });




        if (window.npsLoadClientSelect) {
            window.npsLoadClientSelect("select[name='client_id']", "{{.h.Client.Id}}");
        }
    })

</script>
