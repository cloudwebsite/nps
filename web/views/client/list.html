<section class="wrapper wrapper-content animated fadeInRight management-page management-page--client" aria-labelledby="client-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="客户端管理" data-i18n-en="Client management">客户端管理</div>
            <h1 id="client-list-title" langtag="page-clientlist"></h1>
            <p data-i18n-zh="管理客户端、访问凭证与连接状态。" data-i18n-en="Manage clients, credentials, and connection status.">管理客户端、访问凭证与连接状态。</p>
        </div>
    </header>
    <div class="management-page-grid">
        <div class="management-page-column">
            <section class="panel ibox float-e-margins management-table-card nps-panel">
                <div class="ibox-content management-table-content">
                    <div id="toolbar" class="nps-toolbar-row management-table-toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span>
                        </a>
                        {{if eq true .isAdmin}}
                        <a href="#" onclick="batchDelete('{{.web_base_url}}/client/del');return false;" class="btn btn-danger dim">
                            <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span>
                        </a>
                        {{end}}
                    </div>
                    <table id="table"></table>
                </div>
            </section>
        </div>
    </div>
</section>

<script>
    /*bootstrap table*/
    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        sortName: 'Id', // 默认按 ID 排序
        sortOrder: 'desc', // 默认倒序，新增的客户端排在最前面
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageSize: npsPageSize.get(),//每页条数，优先使用上次选择
        pageList: npsPageSize.list,//分页步进值
        onPageChange: function (number, size) { npsPageSize.save(size); },
        detailView: true,
        smartDisplay: false, // 始终显示完整的每页条数和分页栏
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang ('#table'); },
        detailFormatter: function (index, row, element) {
            return '<b langtag="word-maxconnections"></b>: ' + row.MaxConn + '&emsp;'
                + '<b langtag="word-curconnections"></b>: ' + row.NowConn + '&emsp;'
                + '<b langtag="word-flowlimit"></b>: ' + row.Flow.FlowLimit + 'm&emsp;'
                + '<b langtag="word-ratelimit"></b>: ' + row.RateLimit + 'KB/s&emsp;'
                + '<b langtag="word-maxtunnels"></b>: ' + row.MaxTunnelNum + '&emsp;<br/><br/>'
                + '<b langtag="word-webusername"></b>: ' + row.WebUserName + '&emsp;'
                + '<b langtag="word-webpassword"></b>: ' + row.WebPassword + '&emsp;'
                + '<b langtag="word-basicusername"></b>: ' + row.Cnf.U + '&emsp;'
                + '<b langtag="word-basicpassword"></b>: ' + row.Cnf.P + '&emsp;<br/><br/>'
                + '<b langtag="word-connectbyconfig"></b>: <span langtag="word-' + row.ConfigConnAllow + '"></span>&emsp;<br/><br/>'
                + '<b langtag="word-ipwhite"></b>: ' + row.IpWhite + '&emsp;'
                + '<b langtag="word-ipwhitepass"></b>: ' + row.IpWhitePass + '&emsp;<br/>'
                + '<b langtag="word-ipwhitelist"></b>: ' + row.IpWhiteList + '&emsp;<br/>'
                + '<b langtag="word-blackip"></b>: ' + row.BlackIpList + '&emsp;<br/><br/>'
                + '<b langtag="word-createtime"></b>: ' + row.CreateTime + '&emsp;<br/>'
                + '<b langtag="word-lastonlinetime"></b>: ' + row.LastOnlineTime + '&emsp;<br/>'
                + '<b langtag="word-expiretime"></b>: ' + (row.ExpireTime || '<span langtag="info-unrestricted"></span>') + '&emsp;<br/><br/>'
                + '<b langtag="word-quicklycommand"></b>: <span>' + encodeToBase64(row.Remark +'|'+'{{.ip}}:{{.p}}|' + row.VerifyKey + '|false')   + '</span>&emsp;<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="" langtag="word-copy">复制</button><br/>'
                + '<b langtag="word-tlsquicklycommand"></b>: <span>' + encodeToBase64(row.Remark +'|'+'{{.ip}}:{{.tls_p}}|' + row.VerifyKey + '|true')   + '</span>&emsp;<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="" langtag="word-copy">复制</button><br/>'
                + '<b langtag="word-commandclient"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + row.VerifyKey + " -type=" +{{.bridgeType}} +"</code><button class=\"copy btn btn-info btn-xs\" onclick=\"copyCommand(this)\" data-clipboard-text=\"\" langtag=\"word-copy\">复制</button><br/>"
                + '<b langtag="word-commandclient-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + row.VerifyKey + " -tls_enable=true</code><button class=\"copy btn btn-info btn-xs\" onclick=\"copyCommand(this)\" data-clipboard-text=\"\" langtag=\"word-copy\">复制</button>"
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'UserId',
                title: '用户ID',
                halign: 'center',
                sortable: true,
                visible: true,
                formatter: function (value) {
                    return value ? value : '-';
                }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return value
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'LocalAddr',//域值
                title: '<span langtag="word-localaddr"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.ExportFlow)
                }
            },
            {
                field: 'NowRate',//域值
                title: '<span langtag="word-speed"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    return changeunit(row.Rate.NowRate) + "/S"
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value) {
                    return npsOpenBadge(!!value, 'open', 'close');
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value) {
                    return npsOnlineBadge(!!value, 'online', 'offline');
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                class: 'client-list__option',
                formatter: function (value, row, index) {
                    var btn_group = '<div class="client-actions client-actions--manage">'

                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<button type="button" onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning client-action-btn" title="停用客户端" data-title-zh="停用客户端" data-title-en="Disable client" data-aria-label-zh="停用客户端" data-aria-label-en="Disable client"><i class="fa fa-pause" aria-hidden="true"></i></button>'
                    } else {
                        btn_group += '<button type="button" onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary client-action-btn" title="启用客户端" data-title-zh="启用客户端" data-title-en="Enable client" data-aria-label-zh="启用客户端" data-aria-label-en="Enable client"><i class="fa fa-play" aria-hidden="true"></i></button>'
                    }
                    {{if eq true .allow_remote_update}}
                    if (row.IsConnect) {
                        btn_group += '<button type="button" onclick="submitform(\'upgrade\', \'{{.web_base_url}}/client/remoteupdate\', {\'id\':' + row.Id
                        btn_group += '})" class="btn btn-outline btn-info client-action-btn" title="远程升级" data-title-zh="远程升级" data-title-en="Remote upgrade" data-aria-label-zh="远程升级" data-aria-label-en="Remote upgrade"><i class="fa fa-cloud-upload" aria-hidden="true"></i></button>'
                    }
                    {{end}}
                    btn_group += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger client-action-btn" title="删除客户端" data-title-zh="删除客户端" data-title-en="Delete client" data-aria-label-zh="删除客户端" data-aria-label-en="Delete client"><i class="fa fa-trash" aria-hidden="true"></i></button>'
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-success client-action-btn" title="编辑客户端" data-title-zh="编辑客户端" data-title-en="Edit client" data-aria-label-zh="编辑客户端" data-aria-label-en="Edit client"><i class="fa fa-edit" aria-hidden="true"></i></a></div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'client-list__view',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return '<div class="client-actions client-actions--view">'
                        + '<a href="{{.web_base_url}}/index/all?client_id=' + row.Id
                        + '" class="btn btn-outline btn-primary client-action-btn" title="查看隧道" data-title-zh="查看隧道" data-title-en="View tunnels" data-aria-label-zh="查看隧道" data-aria-label-en="View tunnels"><i class="fa fa-retweet" aria-hidden="true"></i><span class="visually-hidden" langtag="word-tunnel">隧道</span></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + row.Id
                        + '" class="btn btn-outline btn-success client-action-btn" title="查看主机" data-title-zh="查看主机" data-title-en="View hosts" data-aria-label-zh="查看主机" data-aria-label-en="View hosts"><i class="fa fa-globe" aria-hidden="true"></i><span class="visually-hidden" langtag="word-host">主机</span></a></div>'
                }
            }
        ]
    });

    function encodeToBase64(str){
        const utf8Str = unescape(encodeURIComponent("nps:"+str));
        return btoa(utf8Str);
    }

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling.innerHTML)
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        // alert("复制成功"+e.text)
        toastr.success('复制成功');
        e.clearSelection();
    });

    clipboard.on('error', function (e) {
        // alert("复制失败")
        toastr.error('复制失败', '提示');
    });


</script>
