<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title"><h5>编辑用户 #{{.u.Id}}</h5></div>
                <div class="ibox-content">
                    <form class="form-horizontal" onsubmit="return submitForm()">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">用户名</label>
                            <div class="col-sm-6"><input class="form-control" id="username" value="{{.u.UserName}}" required></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">新密码</label>
                            <div class="col-sm-6"><input class="form-control" type="password" id="password" placeholder="留空则不修改"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">备注</label>
                            <div class="col-sm-6"><input class="form-control" id="remark" value="{{.u.Remark}}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">客户端配额</label>
                            <div class="col-sm-6"><input class="form-control" id="max_client_num" value="{{.u.MaxClientNum}}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">隧道配额</label>
                            <div class="col-sm-6"><input class="form-control" id="max_tunnel_num" value="{{.u.MaxTunnelNum}}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">到期时间</label>
                            <div class="col-sm-6"><input class="form-control" id="expire_time" value="{{.u.ExpireTime}}"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">状态</label>
                            <div class="col-sm-6">
                                <select class="form-control" id="status">
                                    <option value="true" {{if .u.Status}}selected{{end}}>启用</option>
                                    <option value="false" {{if not .u.Status}}selected{{end}}>停用</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-6">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="{{.web_base_url}}/user/list" class="btn btn-white">返回</a>
                            </div>
                        </div>
                    </form>
                    <hr>
                    <h4>绑定客户端</h4>
                    <div class="form-inline">
                        <input class="form-control" id="bind_client_id" placeholder="client_id">
                        <button class="btn btn-info" type="button" onclick="bindClient()">绑定到本用户</button>
                        <button class="btn btn-warning" type="button" onclick="unbindClient()">解绑（UserId=0）</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function submitForm() {
    $.ajax({
        type: "POST",
        url: "{{.web_base_url}}/user/edit",
        data: {
            id: {{.u.Id}},
            username: $("#username").val(),
            password: $("#password").val(),
            remark: $("#remark").val(),
            max_client_num: $("#max_client_num").val(),
            max_tunnel_num: $("#max_tunnel_num").val(),
            expire_time: $("#expire_time").val(),
            status: $("#status").val()
        },
        success: function (res) {
            if (res.status === 1) {
                window.location.href = "{{.web_base_url}}/user/list";
            } else {
                alert(res.msg || "failed");
            }
        }
    });
    return false;
}
function bindClient() {
    $.post("{{.web_base_url}}/user/bindclient", {user_id: {{.u.Id}}, client_id: $("#bind_client_id").val()}, function (res) {
        alert(res.msg || (res.status === 1 ? "ok" : "failed"));
    });
}
function unbindClient() {
    $.post("{{.web_base_url}}/user/bindclient", {user_id: 0, client_id: $("#bind_client_id").val()}, function (res) {
        alert(res.msg || (res.status === 1 ? "ok" : "failed"));
    });
}
</script>
