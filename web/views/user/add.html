<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title"><h5>添加用户</h5></div>
                <div class="ibox-content">
                    <form class="form-horizontal" method="post" onsubmit="return submitForm()">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">用户名</label>
                            <div class="col-sm-6"><input class="form-control" name="username" id="username" required></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">密码</label>
                            <div class="col-sm-6"><input class="form-control" type="password" name="password" id="password" required></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">备注</label>
                            <div class="col-sm-6"><input class="form-control" name="remark" id="remark"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">客户端配额</label>
                            <div class="col-sm-6"><input class="form-control" name="max_client_num" id="max_client_num" value="0" placeholder="0=不限"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">隧道配额</label>
                            <div class="col-sm-6"><input class="form-control" name="max_tunnel_num" id="max_tunnel_num" value="0" placeholder="0=不限"></div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">到期时间</label>
                            <div class="col-sm-6"><input class="form-control" name="expire_time" id="expire_time" placeholder="留空不限"></div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-6">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="{{.web_base_url}}/user/list" class="btn btn-white">返回</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function submitForm() {
    $.ajax({
        type: "POST",
        url: "{{.web_base_url}}/user/add",
        data: {
            username: $("#username").val(),
            password: $("#password").val(),
            remark: $("#remark").val(),
            max_client_num: $("#max_client_num").val(),
            max_tunnel_num: $("#max_tunnel_num").val(),
            expire_time: $("#expire_time").val()
        },
        success: function (res) {
            if (res.status === 1) {
                window.location.href = "{{.web_base_url}}/user/list";
            } else {
                alert(res.msg || "failed");
            }
        }
    });
    return false;
}
</script>
